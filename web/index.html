<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RenderLoc — Live Gaussian Localization</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
    #viewer { width: 100vw; height: 100vh; }
    #hud {
      position: fixed; left: 12px; top: 12px; z-index: 10;
      font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace;
      color: #eee; background: rgba(0,0,0,.55); padding: 8px 12px;
      border-radius: 8px; pointer-events: none; white-space: pre;
    }
    #help {
      position: fixed; right: 12px; bottom: 12px; z-index: 10;
      font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace;
      color: #ddd; background: rgba(0,0,0,.45); padding: 8px 10px;
      border-radius: 8px; pointer-events: none; white-space: pre;
    }
    #hud .ok { color: #4ade80; }
    #hud .bad { color: #f87171; }

    /* 상단 패널 2개: 미니맵(네비) + 카메라 시점 */
    #panels {
      position: fixed; top: 12px; right: 12px; z-index: 11;
      display: flex; gap: 10px; align-items: flex-start;
    }
    .panel {
      background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.18);
      border-radius: 10px; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.5);
    }
    .panel .cap {
      font: 11px/1.6 ui-monospace, Menlo, Consolas, monospace;
      color: #ccc; padding: 2px 8px; background: rgba(255,255,255,.06);
    }
    #miniMap { display: block; width: 240px; height: 240px; background: #0c0f14; }
    #camView {
      display: block; width: 320px; height: 240px; object-fit: contain;
      background: #000;
    }
    #camPanel.empty { display: none; }   /* 카메라 토픽 없으면 숨김 */
  </style>
  <!-- gaussian-splats-3d.module.js 가 'three' 를 import → 로컬 빌드로 매핑 -->
  <script type="importmap">
    { "imports": { "three": "./lib/three.module.js" } }
  </script>
</head>
<body>
  <div id="viewer"></div>

  <div id="panels">
    <div class="panel" id="navPanel">
      <div class="cap">navigation</div>
      <canvas id="miniMap" width="240" height="240"></canvas>
    </div>
    <div class="panel empty" id="camPanel">
      <div class="cap">camera view</div>
      <img id="camView" alt="camera view" />
    </div>
  </div>

  <div id="hud">RenderLoc live viewer
연결: <span id="conn" class="bad">SSE 대기…</span>
load: <span id="load">HTML loaded</span>
pose#: <span id="cnt">0</span>
topic: <span id="topic">-</span>
xyz: <span id="xyz">-</span>
view: <span id="viewmode">free</span><span id="err"></span></div>
  <div id="help">Mouse: orbit / pan / zoom
F: follow marker
C: look from pose
R: reset view</div>
  <script>
    function showErr(m) {
      const e = document.getElementById("err");
      if (e) e.innerHTML += '\n<span class="bad">ERR: ' + m + "</span>";
      console.error(m);
      try { fetch("/clientlog?m=" + encodeURIComponent(String(m))); } catch (_) {}
    }
    window.addEventListener("error", (e) =>
      showErr((e.message || "load error") + " @ " + (e.filename || "")));
    window.addEventListener("unhandledrejection", (e) =>
      showErr("promise: " + ((e.reason && e.reason.message) || e.reason)));
  </script>
  <script type="module" src="./viewer.js"></script>
</body>
</html>
