# =============================================================================
# RenderLoc Configuration
# =============================================================================
# Single-image 6DoF localization in PLY maps via render-and-match
# =============================================================================

camera:
  fx: 1039.04598063
  fy: 1041.49694151
  cx: 937.04407689
  cy: 560.82673816
  width: 1920
  height: 1200
  # fx: 2256.627197
  # fy: 2254.400635
  # cx: 1891.352783
  # cy: 1087.097656
  # width: 3840
  # height: 2160
  depth_scale: 1000.0
  depth_min: 0.3
  depth_max: 15.0

sampling:
  max_floors: 1          # 단일층 강제
  min_floor_gap: 2.5     # 2.5m 이내 peak 병합
  max_floor_height: 5.0  # 5m 이상 무시
  floor_band: 0.3
  num_yaw_angles: 6
  height_offsets_m: [0.0, 1.5]   # 기준높이 / 20cm 아래 / 20cm 위 → 4×3=12 views/pos

rendering:
  inpaint_background: true  # 활성화
  inpaint_radius: 3
  ceiling_clip: true       # split-render 활성화
  ceiling_margin: 0.5 
  output_dir: "data/rendered/"
  point_size: 2.0
  rho_min: 2.0
  render_color: true

features:
  superpoint_model: "models/superpoint_v1.pt"
  max_keypoints: 1024
  keypoint_threshold: 0.005
  global_model: "models/netvlad.pt"
  global_desc_dim: 512
  use_gpu: true
  # ── Global descriptor method ─────────────────────────────────────────
  # "megaloc" : MegaLoc 8448-dim (실외 도시 학습, 실내 splat 도메인 갭 있음)
  # "mixvpr"  : MixVPR ResNet50 기반 (512/128/4096-dim, 권장)
  #             사전 준비: git clone https://github.com/amaralibey/MixVPR third_party/MixVPR
  global_desc_method: "mixvpr"
  # ── MixVPR 설정 ──────────────────────────────────────────────────────
  mixvpr_ckpt: "models/mixvpr_resnet50_4096.ckpt"  # ResNet50 4096-dim, GSV-Cities trained
  mixvpr_out_dim: 4096          # 128 / 512 / 4096
  grid_n: 1                     # 수직 스트립 수 (1=global only, 2=좌+우, 3=좌+중+우) → dim=(1+N)×out_dim
  use_depth_desc: false         # depth histogram descriptor 추가 여부
  depth_bins: 32                # depth 히스토그램 bin 수
  depth_rgb_weight: 0.7         # RGB 가중치 (depth = 1 - 이 값)
  # ── Matcher 선택 ──────────────────────────────────────────────────────
  # "eloftr"              : 기존 EfficientLoFTR (third_party/EfficientLoFTR)
  # vismatch 계열 예시:
  #   "loftr"             : LoFTR
  #   "superpoint-lightglue" : SuperPoint + LightGlue
  #   "disk-lightglue"    : DISK + LightGlue
  #   "aliked-lightglue"  : ALIKED + LightGlue
  #   "roma"              : RoMa (dense)
  #   "xfeat"             : XFeat
  # vismatch 전체 목록: https://github.com/gmberton/vismatch
  # matcher_name: "xfeat"
  matcher_name : "eloftr"
  eloftr_ckpt: ""           # 비워두면 기본 경로 사용
  eloftr_opt: false         # true = optimized(경량) 모드
  match_conf_thresh: 0.2    # eloftr 전용 confidence threshold
  eloftr_max_dim: 840       # 이미지 최대 해상도 (eloftr)
  vismatch_max_dim: 840     # 이미지 최대 해상도 (vismatch)

matching:
  superglue_model: "models/superglue_indoor.pth"
  match_threshold: 0.2
  retrieval_factor: 3   # depth re-ranking용 초기 후보 배수 (top_k × factor개 RGB 검색 후 재정렬)
  top_k_retrieval: 5   # 도메인 갭(real photo↔splat render) 보정용으로 크게 설정
  use_gpu: true

pnp:
  # ── Solver 선택 ──────────────────────────────────────────────────────
  # "opencv"      : cv2.solvePnPRansac (EPnP + vanilla RANSAC)
  # "superansac"  : PROSAC + MAGSAC + GCRANSAC local opt (권장)
  solver: "opencv"
  # ── 공통 파라미터 ─────────────────────────────────────────────────────
  reproj_threshold: 4.0      # inlier threshold (pixels)
  min_inliers: 6
  refine: true               # RANSAC 후 inlier만으로 iterative refine
  # ── OpenCV 전용 ──────────────────────────────────────────────────────
  ransac_iterations: 1000
  pnp_confidence: 0.99
  # ── SuperANSAC 전용 ──────────────────────────────────────────────────
  superansac_max_iterations: 1000
  superansac_confidence: 0.99

icp:
  enable: false
  max_iterations: 30
  max_correspondence_dist: 1.0
  fitness_threshold: 0.3
  use_gicp: true

database:
  db_path: "data/image_db.bin"
  ply_map_path: ""