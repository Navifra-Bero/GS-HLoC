# =============================================================================
# RenderLoc Configuration
# =============================================================================
# Single-image 6DoF localization in PLY maps via render-and-match
# =============================================================================

camera:
  fx: 1039.04598063
  fy: 1041.49694151
  cx: 937.04407689
  cy: 560.82673816
  width: 1920
  height: 1200
  depth_scale: 1000.0
  depth_min: 0.3
  depth_max: 15.0

alignment:
  normal_threshold: 0.6
  max_plane_trials: 8
  apply_pre_rotation: true
  up_axis: "y_neg"           # GS-SDF/omni result_gs.ply: -Y up → +Z
  yaw_deg: 90.0              # Z-up 정렬 후 top-down 방향 보정. 반대면 -90.0
  # 정렬(Z-up) 후 외곽 노이즈 제거. 주차장 외벽 바깥쪽 원형 포인트 제거용.
  # gs_sdf_omni: 본체 씬 반경 ~45m, 50~70m gap, 70m+ 원형 링 → 반경 55m로 컷
  crop:
    enable: true
    xy_radius: 55.0         # 이 XY 반경(중심 기준)을 넘는 포인트 제거
    center: [0.0, 0.0]      # XY 중심. 미지정시 origin
    # z_min: null           # 필요시 Z 범위 제한
    # z_max: null
    # bbox: [xmin, xmax, ymin, ymax]   # 반경 대신 박스 크롭

sampling:
  use_step0_floor: true
  occupancy_mode: "height_slice_obstacle"
  height_above_floor: 1.9
  height_offsets_m: [0.0]
  slice_min_height_m: 0.5
  slice_max_height_m: 1.5
  slice_splat_radius_m: 0.1
  slice_wall_close_m: 0.5
  slice_obstacle_inflate_m: 0.2
  slice_margin_m: 2.0
  distance_thresh_m: 1.0
  corridor_blur_sigma: 0.6
  corridor_blur_threshold: 0.55
  keep_largest_component: true
  grid_resolution: 0.20
  path_spacing: 0.5
  num_yaw_angles: 6

rendering:
  inpaint_background: true  # 활성화
  inpaint_radius: 3
  ceiling_clip: true       # split-render 활성화
  ceiling_margin: 0.5 
  output_dir: "data/rendered/"
  point_size: 2.0
  rho_min: 2.0
  render_color: true
  rasterize_mode: classic       # 또는 antialiased
  pose_convention: opencv        # nerfstudio export 기본값
  gs_roll_180: true
  background_color: [0.0, 0.0, 0.0]
  gaussian_backend: diff
  gaussian_prefilter_visible: true
  gaussian_opacity_min: 0.0
  gaussian_scale_mul: 0.9
  gaussian_scale_max: 1.0

features:
  superpoint_model: "models/superpoint_v1.pt"
  max_keypoints: 1024
  keypoint_threshold: 0.005
  global_model: "models/netvlad.pt"
  global_desc_dim: 512
  use_gpu: true
  # ── Global descriptor method ─────────────────────────────────────────
  # "megaloc" : MegaLoc 8448-dim (실외 도시 학습, 실내 splat 도메인 갭 있음)
  # "mixvpr"  : MixVPR ResNet50 기반 (512/128/4096-dim, 권장)
  #             사전 준비: git clone https://github.com/amaralibey/MixVPR third_party/MixVPR
  global_desc_method: "mixvpr"
  # ── MixVPR 설정 ──────────────────────────────────────────────────────
  mixvpr_ckpt: "models/mixvpr_resnet50_4096.ckpt"  # ResNet50 4096-dim, GSV-Cities trained
  mixvpr_out_dim: 4096          # 128 / 512 / 4096
  grid_n: 1                     # 수직 스트립 수 (1=global only, 2=좌+우, 3=좌+중+우) → dim=(1+N)×out_dim
  use_depth_desc: true         # depth histogram descriptor 추가 여부
  depth_bins: 32                # depth 히스토그램 bin 수
  depth_rgb_weight: 0.7         # RGB 가중치 (depth = 1 - 이 값)
  # ── Matcher 선택 ──────────────────────────────────────────────────────
  # "eloftr"              : 기존 EfficientLoFTR (third_party/EfficientLoFTR)
  # "loftr"               : LoFTR kornia (indoor/outdoor 선택 가능, 권장)
  # "jamma"               : JamMa (Mamba 기반, third_party/JamMa)
  # vismatch 계열 예시:
  #   "superpoint-lightglue" : SuperPoint + LightGlue
  #   "disk-lightglue"    : DISK + LightGlue
  #   "aliked-lightglue"  : ALIKED + LightGlue
  #   "roma"              : RoMa (dense)
  #   "xfeat"             : XFeat
  # vismatch 전체 목록: https://github.com/gmberton/vismatch
  matcher_name : "jamma"
  eloftr_ckpt: ""           # 비워두면 기본 경로 사용
  eloftr_opt: false         # true = optimized(경량) 모드
  match_conf_thresh: 0.2    # eloftr / loftr confidence threshold
  eloftr_max_dim: 840       # 이미지 최대 해상도 (eloftr)
  vismatch_max_dim: 840     # 이미지 최대 해상도 (vismatch)
  # ── LoFTR 설정 ───────────────────────────────────────────────────────
  loftr_variant: "indoor"   # "indoor" (ScanNet) | "outdoor" (MegaDepth)
  loftr_max_dim: 840
  # ── JamMa 설정 ───────────────────────────────────────────────────────
  jamma_ckpt: "third_party/JamMa/weights/jamma.ckpt"
  jamma_max_dim: 640        # MegaDepth 학습 해상도 기준 (논문 기본값)
  jamma_coarse_thr: 0.2     # coarse matching threshold (논문 outdoor 기본값)
  jamma_fine_thr: 0.1       # fine matching threshold (논문 기본값)
  # ── SOLD2 line matching (JamMa point match 이후 pose refinement용) ─────
  sold2_enable: true
  sold2_max_dim: 640
  sold2_min_line_length: 40
  sold2_max_matches: 120

matching:
  superglue_model: "models/superglue_indoor.pth"
  match_threshold: 0.2
  retrieval_factor: 3   # depth re-ranking용 초기 후보 배수 (top_k × factor개 RGB 검색 후 재정렬)
  top_k_retrieval: 5   # 도메인 갭(real photo↔splat render) 보정용으로 크게 설정
  use_gpu: true

pnp:
  # ── Solver 선택 ──────────────────────────────────────────────────────
  # "opencv"      : cv2.solvePnPRansac (EPnP + vanilla RANSAC)
  # "superansac"  : PROSAC + MAGSAC + GCRANSAC local opt (권장)
  solver: "opencv"
  # ── 공통 파라미터 ─────────────────────────────────────────────────────
  reproj_threshold: 4.0      # inlier threshold (pixels)
  min_inliers: 6
  refine: true               # RANSAC 후 inlier만으로 iterative refine
  # ── OpenCV 전용 ──────────────────────────────────────────────────────
  ransac_iterations: 1000
  pnp_confidence: 0.99
  # ── SuperANSAC 전용 ──────────────────────────────────────────────────
  superansac_max_iterations: 1000
  superansac_confidence: 0.99
  # ── Point + line refinement (PnP pose를 초기값으로 SOLD2 lines 사용) ───
  line_refine: true
  line_refine_min_lines: 3
  line_refine_inlier_threshold: 12.0
  line_refine_point_weight: 1.0
  line_refine_line_weight: 0.7
  line_refine_fscale: 5.0
  line_refine_max_nfev: 40

icp:
  enable: false
  max_iterations: 30
  max_correspondence_dist: 1.0
  fitness_threshold: 0.3
  use_gicp: true

database:
  db_path: "data/image_db.bin"
  ply_map_path: ""

multi_cam:
  enabled: false             # true = multi-cam retrieval+matching 활성화
  cam_ids: ["cam_1", "cam_3"] # 사용할 카메라 ID 목록
  primary_cam: "cam_3"        # PnP에 사용할 주 카메라 (intrinsics 기준)
  kapture_dir: "kapture/sensors"  # records_camera.txt 위치
  # ── Retrieval 가중치 ──────────────────────────────────────────────────
  # N=1: primary_cam_weight=1.0 (고정)
  # N=2: primary=primary_cam_weight, other=1-primary_cam_weight
  # N=k: primary=primary_cam_weight, 나머지 각각=(1-primary_cam_weight)/(k-1)
  primary_cam_weight: 0.6     # primary cam 비중 (0.5~0.8 권장)
  min_match_threshold: 10    # primary cam의 good match 수 < 이 값이면 sub-cam fallback 시도
