# =============================================================================
# 실시간 ROS2 Gaussian-Map Localization 노드 파라미터
# =============================================================================
# bag 토픽(cam0/cam1/cam2/cam3, 물리 cam_0/2/4/5 리맵) 중 2개를 골라
# main/sub 로 사용한다. 다른 cam 쌍으로 바꾸려면 cam_topics/cam_info_topics/
# cam_ids/main_cam/sub_cams 를 함께 수정하면 된다.
#
# 주의:
#  - cam_topics / cam_info_topics / cam_ids 는 같은 길이, 같은 순서여야 한다.
#  - cam_ids 는 파이프라인 ID(cam_0, cam_1, ...). DB/rig 보정값(test_data_rectified)
#    이 cam_0/cam_1 기준이므로 기본값은 bag cam0→cam_0(main), cam1→cam_1(sub).
# =============================================================================
/ros_localizer:
  ros__parameters:
    repo_root: ""                       # 비우면 자동탐색 → 실패 시 기본 경로
    config_file: "config/render_loc_multi_cam.yaml"
    output_dir: "output/gs_sdf_omni"    # step4_database.pkl, aligned_map.ply 위치

    cam_topics:
      - "/cam0/image_raw/compressed"
      - "/cam1/image_raw/compressed"
    cam_info_topics:
      - "/cam0/camera_info"
      - "/cam1/camera_info"
    cam_ids:
      - "cam_0"
      - "cam_1"
    main_cam: "cam_0"
    sub_cams:
      - "cam_1"

    undistort: true                     # fisheye → pinhole (원본 K 유지) 필수
    map_frame: "map"
    base_frame: "base_link"
    optical_frame: "base_optical"       # c2w(OpenCV optical) 가 붙는 frame
    rate_hz: 2.0                        # 처리 상한(나머지 프레임 드롭)
    sync_slop: 0.05                     # cam 간 시간 동기 허용오차(s)
    publish_tf: true
    temp_dir: "/tmp/ros_localizer"
    # 웹 뷰어(web_pose_bridge)가 구독하는 토픽
    pose_topic: "/vps/current_pose"
    path_topic: "/vps/pred_path"

# 독립 웹 뷰어용 ROS→SSE 브리지 (Foxglove 불필요)
/web_pose_bridge:
  ros__parameters:
    pose_topic: "/vps/current_pose"
    pose_topic_type: "auto"  # auto | pose | odom
    web_dir: ""          # 비우면 자동탐색 (repo/web)
    splat_path: ""       # 비우면 web_dir/gaussian_map.splat
    host: "0.0.0.0"
    port: 8080

/gaussian_ply_publisher:
  ros__parameters:
    ply_path: "output/gs_sdf_omni/aligned_map.ply"
    map_frame: "map"
    topic: "~/cloud"
    stride: 1                           # 포인트 많으면 2~5로 다운샘플
    opacity_min: 0.0
    publish_period: 2.0
